    <style>
        /* Modern Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            overflow: hidden;
        }

        /* Card Container */
        .landing-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 550px;
            width: 90%;
            animation: slideUp 0.8s ease-out;
            position: relative;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo & Typography */
        .logo-icon {
            font-size: 72px;
            margin-bottom: 15px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        p.tagline {
            color: #718096;
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Call to Action Button */
        .cta-button {
            display: inline-block;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            padding: 16px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px rgba(118, 75, 162, 0.5);
            background: linear-gradient(to right, #764ba2, #667eea);
        }

        /* Features Grid */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 50px;
            border-top: 1px solid #e2e8f0;
            padding-top: 25px;
        }

        .feature { font-size: 0.9rem; color: #4a5568; font-weight: 600; }
        .feature-icon { font-size: 1.8rem; margin-bottom: 8px; display: block; }

        footer { margin-top: 25px; color: rgba(255,255,255,0.8); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="landing-card">

        <p class="tagline">Platform jual beli online masa depan dengan keamanan terjamin, anti-fraud system, dan transaksi yang mudah.</p>
        
        <a href="shop.php" class="cta-button">Mulai Belanja 🚀</a>

        <div class="features-grid">
            <div class="feature">
                <span class="feature-icon">🛡️</span>
                Anti-Fraud
            </div>
            <div class="feature">
                <span class="feature-icon">💳</span>
                Multi Payment
            </div>
            <div class="feature">
                <span class="feature-icon">⭐</span>
                Trusted Review
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 MarketHub Indonesia
    </footer>
</body>
